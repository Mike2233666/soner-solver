<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声纳搜潜 · 潜艇寻找器</title>
<meta name="description" content="声纳搜潜：在 n×n 海域里用尽量少的炸弹找出全部潜艇。每格给出「有潜艇」的概率热力图，并标出该炸的格子；支持自动对局和配合真实游戏的手动记录。">
<meta property="og:type" content="website">
<meta property="og:title" content="声纳搜潜 · 潜艇寻找器">
<meta property="og:description" content="按概率炸：10×10 六艘潜艇平均 40 发，瞎炸要 95 发。">
<meta name="theme-color" content="#06111f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230ea5e9'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='%23021121'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2367e8f9'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #06111f;
    --panel: rgba(15, 38, 64, .72);
    --panel-2: rgba(10, 28, 49, .86);
    --line: rgba(120, 180, 255, .16);
    --text: #e7f1ff;
    --muted: #8fa9c8;
    --accent: #34d399;
    --accent-2: #38bdf8;
    --warn: #fbbf24;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 700px at 12% -10%, rgba(28, 92, 150, .45), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(15, 118, 110, .18), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .app { max-width: 1240px; margin: 0 auto; padding: 22px 22px 34px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; flex-wrap: wrap; gap: 14px 20px;
    align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; letter-spacing: .5px; }
  .brand .logo {
    width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #67e8f9, #0ea5e9 55%, #075985);
    box-shadow: 0 0 16px rgba(56, 189, 248, .55);
    font-size: 15px; color: #02121f;
  }
  .brand small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 2px; }
  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .settings label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .settings input[type=number] { width: 64px; }
  .settings input[type=text] { width: 150px; }
  .settings select { min-width: 105px; }
  input, select, button {
    font: inherit; color: var(--text);
    background: rgba(8, 24, 42, .9);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 10px;
    outline: none;
  }
  input:focus, select:focus { border-color: rgba(56, 189, 248, .7); box-shadow: 0 0 0 3px rgba(56, 189, 248, .12); }
  button { cursor: pointer; transition: .16s ease; }
  button:hover { border-color: rgba(56, 189, 248, .55); background: rgba(17, 44, 74, .95); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(135deg, #0ea5e9, #10b981);
    color: #04121f; font-weight: 700; border: none;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }
  button.tiny { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  label.check { user-select: none; cursor: pointer; }
  label.check input { accent-color: #10b981; }
  .file-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 10px; border-radius: 9px;
    background: rgba(8, 24, 42, .9);
    border: 1px solid var(--line);
    color: var(--text); font-size: 13px;
  }
  .file-label:hover { border-color: rgba(56, 189, 248, .55); }
  .file-label input[type=file] { display: none; }

  /* ---------- 主区域 ---------- */
  main { display: flex; gap: 20px; margin-top: 20px; align-items: flex-start; }
  .board-wrap { flex: 1 1 auto; min-width: 320px; }
  .board-shell {
    position: relative;
    padding: 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  .board-frame {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr);
    grid-template-rows: 20px minmax(0, 1fr);
    gap: 4px;
    width: 100%;
    max-width: 690px;
    margin: 0 auto;
  }
  .col-labels {
    grid-column: 2;
    grid-row: 1;
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    gap: 3px;
    align-items: end;
  }
  .row-labels {
    grid-column: 1;
    grid-row: 2;
    display: grid;
    grid-template-rows: repeat(var(--n), minmax(0, 1fr));
    gap: 3px;
    align-items: center;
  }
  .lbl { color: #64748b; font-size: 10px; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
  .board {
    grid-column: 2;
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    gap: 3px;
    width: 100%;
    aspect-ratio: 1 / 1;
    font-size: 12px;
  }
  .cell {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
    background: rgba(30, 64, 98, .55);
    color: #dbeafe;
    user-select: none;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease, filter .15s ease;
    overflow: hidden;
  }
  .cell::after {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05);
    pointer-events: none;
  }
  .cell:hover { filter: brightness(1.22); transform: translateY(-1px); }
  .cell.miss { background: #0b1a2b; color: #62788f; font-weight: 700; }
  .cell.hit { background: #dc2626; color: #fff; font-weight: 800; }
  .cell.known { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1a1003; font-weight: 800; }
  .cell.cleared { background: #091524; color: #5b86b3; font-size: 1.35em; }
  .cell.best {
    box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(52, 211, 153, .55);
    z-index: 2;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .cell.selected { box-shadow: 0 0 0 3px #fbbf24, 0 0 14px rgba(251, 191, 36, .4); z-index: 3; }
  .cell.pending { box-shadow: 0 0 0 3px #38bdf8, 0 0 14px rgba(56, 189, 248, .45); z-index: 2; }
  .cell.best::before {
    content: ""; position: absolute; top: 3px; right: 3px;
    width: 6px; height: 6px; border-radius: 50%;
    background: #ecfdf5; box-shadow: 0 0 6px #fff;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--accent), 0 0 10px rgba(52, 211, 153, .35); }
    50% { box-shadow: 0 0 0 3px var(--accent), 0 0 22px rgba(52, 211, 153, .7); }
  }

  .legend { display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 12px 4px 0; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .swatch.known { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .swatch.hit { background: #dc2626; }
  .swatch.miss { background: #0b1a2b; border: 1px solid #334155; }
  .swatch.best { background: transparent; box-shadow: 0 0 0 2px var(--accent); }
  .swatch.cleared { background: #0d1c2d; border: 1px solid #243b53; }

  .action-bar {
    margin-top: 12px; min-height: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 0 2px;
  }
  .action-bar .hint { color: var(--muted); font-size: 13px; }
  .action-bar .pending-label { color: #bae6fd; font-size: 13px; margin-right: 4px; }
  .action-bar .spacer { flex: 1; }

  .banner {
    display: none;
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(16, 185, 129, .22), rgba(14, 165, 233, .18));
    border: 1px solid rgba(52, 211, 153, .55);
    color: #d1fae5;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .3px;
  }
  .banner.show { display: block; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- 侧栏 ---------- */
  .sidebar { width: 350px; flex: 0 0 350px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .card-title {
    font-size: 12px; letter-spacing: 2px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .rec .coord {
    font-size: 30px; font-weight: 800; letter-spacing: 1px;
    line-height: 1.15;
    background: linear-gradient(90deg, #a7f3d0, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rec .coord small { font-size: 15px; color: var(--muted); -webkit-text-fill-color: var(--muted); font-weight: 500; }
  .rec .prob-text { margin: 8px 0 2px; color: var(--muted); font-size: 13px; }
  .rec .prob-text b { color: var(--accent); font-size: 18px; }
  .prob-track { height: 8px; background: rgba(2, 15, 28, .8); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
  .prob-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #34d399); transition: width .25s ease; }
  .rec .alts { color: var(--muted); font-size: 12px; margin: 8px 0 12px; line-height: 1.5; }
  .rec .done-text { font-size: 20px; font-weight: 700; color: var(--accent); }
  .wide { width: 100%; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(14, 116, 144, .18);
    border: 1px solid rgba(56, 189, 248, .28);
    font-size: 13px; color: #bae6fd;
  }
  .chip.found { background: rgba(245, 158, 11, .15); border-color: rgba(245, 158, 11, .45); color: #fcd34d; text-decoration: line-through; opacity: .85; }
  .stats { color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .stats b { color: #dbeafe; font-weight: 600; }
  .stats .saved { color: #64748b; font-size: 11.5px; margin-top: 6px; }
  .delta { font-size: 12px; }
  .delta.worse { color: #fca5a5; }
  .delta.better { color: #6ee7b7; }

  .log { max-height: 240px; overflow-y: auto; font-size: 13px; }
  .log-row { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(120, 180, 255, .1); color: #cbd5e1; }
  .log-row:last-child { border-bottom: none; }
  .log-row .no { color: #64748b; width: 26px; flex: none; font-variant-numeric: tabular-nums; }
  .log-row .res { font-weight: 700; }
  .log-row .res.hit { color: #fca5a5; }
  .log-row .res.miss { color: #7dd3fc; }
  .log-row .res.ship { color: #fcd34d; }
  .log-empty { color: #64748b; font-size: 13px; }

  .error {
    margin-top: 10px; padding: 10px 12px;
    border-radius: 10px; background: rgba(239, 68, 68, .12);
    border: 1px solid rgba(239, 68, 68, .4);
    color: #fecaca; font-size: 13px; white-space: pre-wrap;
  }
  .method { color: #64748b; font-size: 11.5px; margin-top: 10px; }

  .foot { margin-top: 20px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .foot a { color: var(--accent-2); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  @media (max-width: 940px) {
    main { flex-direction: column; }
    .sidebar { width: 100%; flex: 1 1 auto; }
    .board { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">◉</span>
      <div>声纳搜潜 <small>Sonar Solver</small></div>
    </div>
    <div class="settings">
      <label>棋盘 n <input id="nInput" type="number" min="2" max="30" step="1" value="10"></label>
      <label>潜艇长度 <input id="lengthsInput" type="text" value="4,3,3,2" spellcheck="false" title="可写多艘不同长度，如：5,4,3,3,2"></label>
      <label class="check"><input id="noTouch" type="checkbox" checked> 不能相邻（八角格）</label>
      <label>模式
        <select id="mode">
          <option value="game">自动对局</option>
          <option value="record">手动记录</option>
        </select>
      </label>
      <button id="newBtn" class="primary">新对局</button>
      <button id="undoBtn">撤销</button>
      <button id="autoBtn">自动演示</button>
      <button id="exportBtn" title="把当前对局存成 JSON 文件">导出</button>
      <label class="check file-label">导入<input id="importInput" type="file" accept="application/json"></label>
    </div>
  </header>

  <main>
    <section class="board-wrap">
      <div class="board-shell">
        <div class="board-frame" id="boardFrame" style="--n:10">
          <div class="col-labels" id="colLabels"></div>
          <div class="row-labels" id="rowLabels"></div>
          <div id="board" class="board"></div>
        </div>
      </div>
      <div class="legend">
        <span><i class="swatch best"></i>推荐点</span>
        <span><i class="swatch known"></i>已击沉潜艇</span>
        <span><i class="swatch hit"></i>命中（单格）</span>
        <span><i class="swatch miss"></i>未命中</span>
        <span><i class="swatch cleared"></i>已排除</span>
        <span>格内数字 = 该格有未击沉潜艇的概率</span>
      </div>
      <div id="actionBar" class="action-bar"></div>
      <div id="banner" class="banner"></div>
    </section>

    <aside class="sidebar">
      <div class="card rec" id="recCard"></div>
      <div class="card" id="fleetCard"></div>
      <div class="card" id="scoreCard"></div>
      <div class="card" id="logCard"></div>
    </aside>
  </main>

  <footer class="foot">
    为什么能少炸一半？<a href="story.html">看这篇：95 发 → 40 发</a>
  </footer>
</div>

<script src="sonar_core.js"></script>
<script src="app.js"></script>
</body>
</html>
